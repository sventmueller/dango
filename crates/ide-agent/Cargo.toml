[package]
name = "ide-agent"
version = "0.0.0"
description = "The app's own agent (E6): language model providers, their keys and prices, and the agent's tools and loop"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
globset = "0.4.21"
ide-core = { path = "../ide-core" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
ide-project = { path = "../ide-project" }
ide-thread = { path = "../ide-thread" }
ignore = "0.4.34"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
