[package]
name = "ide-project"
version = "0.0.0"
description = "A project folder without a window: its tree, changes on disk, quick open, search and whether it is trusted"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-core = { path = "../ide-core" }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"
