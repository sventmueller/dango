[package]
name = "ide-ui-export"
version.workspace = true
description = "Markdown documents as PDF, HTML and Word files, with the sheet that shows a running export"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-core.workspace = true
ide-ui-common.workspace = true
splat-decoder.workspace = true
splat-file-state.workspace = true
splat-i18n.workspace = true
splat-markdown.workspace = true
splat-preview.workspace = true
splat-render.workspace = true
block2.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { workspace = true, features = ["testing"] }

[features]
# What the self-test reads of a running export and the button it presses on the export's sheet.
selftest = []
