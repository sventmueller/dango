[package]
name = "ide-factory"
version = "0.0.0"
description = "The Leitstand's orchestrator: work orders, their state machine, event log, limits, routing, gates and evidence, without AppKit and without an async runtime"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4.21"
ide-product = { workspace = true }
ide-thread = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml_edit = { version = "0.25.19", features = ["parse", "display", "serde"] }

[dev-dependencies]
proptest = "1.12.0"
