[package]
name = "ide-core"
version = "0.0.0"
description = "Settings, folders, shortcuts and worker threads, without a window"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Helpers the crates' tests share, such as a folder of its own for each test.
testing = ["dep:rustix"]

[dependencies]
ide-product.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1.1.6", features = ["time"], optional = true }
