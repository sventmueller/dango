[package]
name = "ide-core"
version.workspace = true
description = "Settings, folders, shortcuts and worker threads, without a window"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Helpers the crates' tests share, such as a folder of its own for each test.
testing = ["rustix/time"]

[dependencies]
