[package]
name = "ide-lsp"
version.workspace = true
description = "Language servers for Go, Rust and TypeScript: the protocol client, finding the servers and installing them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
fuzzing = []

# A stand-in language server for the tests; Cargo builds bins before integration tests and names their path.
[[bin]]
name = "ide-lsp-fake-server"
path = "tests/support/fake_server.rs"
test = false
doc = false

[dependencies]
ide-core = { path = "../ide-core" }
ide-document = { path = "../ide-document" }
ide-net = { path = "../ide-net" }
ide-process = { path = "../ide-process" }
ide-rpc = { path = "../ide-rpc" }
ide-product = { path = "../ide-product" }
ide-project = { path = "../ide-project" }
flate2 = "1.1.11"
lsp-types = "0.97.0"
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
splat-i18n.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
sha2 = "0.11.1"
