[package]
name = "ide-lsp"
version = "0.0.0"
description = "Language servers for Go, Rust and TypeScript: the protocol client, finding the servers and installing them"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
fuzzing = []

# A stand-in language server for the tests; Cargo builds bins before integration tests and names their path.
[[bin]]
name = "ide-lsp-fake-server"
path = "tests/support/fake_server.rs"
test = false
doc = false

[dependencies]
ide-core = { path = "../ide-core" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
flate2 = "1.1.11"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
