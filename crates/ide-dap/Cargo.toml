[package]
name = "ide-dap"
version = "0.0.0"
description = "Debugging through the Debug Adapter Protocol: sessions, the adapters, launch configurations and who owns which process"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
fuzzing = []
# The scripted adapter `fake` and its process, for tests and the self-test; not in the shipped app.
testing = []

# The fake adapter as a process, for the tests of process ownership; Cargo builds bins before integration tests.
[[bin]]
name = "ide-dap-fake-adapter"
path = "tests/support/fake_adapter.rs"
test = false
doc = false
required-features = ["testing"]

[dependencies]
splat-i18n.workspace = true
ide-core = { path = "../ide-core" }
ide-document = { path = "../ide-document" }
ide-net = { path = "../ide-net" }
ide-process = { path = "../ide-process" }
ide-rpc = { path = "../ide-rpc" }
ide-product = { path = "../ide-product" }
libc.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
# Itself with the test doubles, for the integration tests and doctests.
ide-dap = { path = ".", features = ["testing"] }
sha2 = "0.11.1"
