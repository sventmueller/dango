[package]
name = "ide-ui-dictation"
version.workspace = true
description = "Dictation into the app's text fields through lowspeak: the microphone controls, fn, the keys and the menu item"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-core.workspace = true
ide-product.workspace = true
ide-secrets.workspace = true
ide-ui-common.workspace = true
splat-i18n.workspace = true
serde = { workspace = true, optional = true }
lowspeak = { workspace = true, optional = true }
block2.workspace = true
libc.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-application-services = { workspace = true, optional = true }
objc2-av-foundation = { workspace = true, optional = true }
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { workspace = true, features = ["testing"] }

[features]
# lowspeak and the frameworks it needs; lowspeak builds whisper.cpp with cmake, so only the app's `dictation` turns it on.
engine = ["dep:lowspeak", "dep:serde", "dep:objc2-application-services", "dep:objc2-av-foundation"]
# What the self-test reads of the fields, and a microphone and an engine that play what a scenario prepared.
selftest = []
