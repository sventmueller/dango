[package]
name = "ide-terminal"
version = "0.0.0"
description = "Terminal sessions: the shell in a PTY, its screen, keys and mouse as bytes, shell integration and what runs in front"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
fuzzing = []

[dependencies]
ide-core = { path = "../ide-core" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
alacritty_terminal = { version = "0.26.0", default-features = false }
libc = "0.2.191"
memchr = "2.8.3"
polling = "3.11.0"
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
proptest = "1.12.0"
