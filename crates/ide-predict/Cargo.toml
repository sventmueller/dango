[package]
name = "ide-predict"
version = "0.0.0"
description = "Edit predictions: what a provider proposes to write next, from GitHub Copilot or a local fill-in-the-middle model"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
# The scripted provider `stub`, for tests and the self-test; not in the shipped app.
testing = []
fuzzing = []

# A stand-in for copilot-language-server in the tests; Cargo builds bins before integration tests and names their path.
[[bin]]
name = "ide-predict-fake-copilot"
path = "tests/support/fake_copilot.rs"
test = false
doc = false

[dependencies]
ide-core.workspace = true
ide-lsp = { path = "../ide-lsp" }
ide-net = { path = "../ide-net" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
serde_json = "1.0.154"
splat-i18n.workspace = true
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
# Itself with the scripted provider, for the integration tests and doctests.
ide-predict = { path = ".", features = ["testing"] }
