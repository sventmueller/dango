[package]
name = "ide-vim"
version.workspace = true
description = "Vim's modes, keys, motions and operators on a shadow copy of an editor's text, without AppKit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
modalkit = { version = "=0.0.32", default-features = false }
regex = "1"
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
proptest = "1.12.0"
