[package]
name = "ide-git"
version = "0.0.0"
description = "git for the app: status, diffs, staging by hunk, commits, remotes, worktrees, checkpoints and the secrets check"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Entry points for the fuzz targets in `fuzz/`, which reach parts that are not public.
[features]
fuzzing = []
# What the self-test reads of the worktree readings.
selftest = []

[dependencies]
ide-core = { path = "../ide-core" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
splat-i18n.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
proptest = "1.12.0"
