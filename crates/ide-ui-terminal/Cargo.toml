[package]
name = "ide-ui-terminal"
version = "0.0.0"
description = "How a terminal tab draws: fonts and cells with Core Graphics or Metal, colours, line characters, links, keys and the view's decisions"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-terminal.workspace = true
ide-ui-common.workspace = true
splat-i18n.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
