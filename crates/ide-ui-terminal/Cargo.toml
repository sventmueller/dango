ide-terminal.workspace = true
ide-ui-common.workspace = true
splat-i18n.workspace = true
block2.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# What the self-test drives and reads in a terminal view.
selftest = []
