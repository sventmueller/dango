[package]
name = "ide-docker"
version = "0.0.0"
description = "Containers, images, volumes and Compose projects through the docker command line, read as JSON lines"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
