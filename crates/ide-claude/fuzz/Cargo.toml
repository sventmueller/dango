[package]
name = "ide-claude-fuzz"
version = "0.0.0"
description = "Fuzz targets of ide-claude (E95); `cargo xtask fuzz` runs them with the nightly cargo-fuzz needs"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own, so that the nightly-only build stays out of the app's.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.10"
ide-claude = { path = ".." }
ide-thread = { path = "../../ide-thread" }

[[bin]]
name = "stream_json"
path = "fuzz_targets/stream_json.rs"
test = false
doc = false
bench = false
