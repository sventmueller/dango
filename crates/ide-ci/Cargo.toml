[package]
name = "ide-ci"
version = "0.0.0"
description = "CI for the app: GitHub Actions and GitLab CI of a repository's remote, with tokens per host"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
base64 = "0.22.1"
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
