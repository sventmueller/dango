[package]
name = "ide-ci"
version = "0.0.0"
description = "CI for the app: GitHub Actions and GitLab CI of a repository's remote, with tokens per host"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ide-secrets = { path = "../ide-secrets" }
ide-net = { path = "../ide-net" }
ide-core = { path = "../ide-core" }
ide-process = { path = "../ide-process" }
ide-product = { path = "../ide-product" }
base64 = "0.23.1"
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
ide-workspace-hack.workspace = true

[dev-dependencies]
ide-core = { path = "../ide-core", features = ["testing"] }
