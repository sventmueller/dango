# Settings of `cargo hakari`, which keeps crates/ide-workspace-hack current; see docs.rs/cargo-hakari for the options.

hakari-package = "ide-workspace-hack"
dep-format-version = "4"
workspace-hack-line-style = "workspace-dotted"
resolver = "2"
unify-target-host = "replicate-target-on-host"
platforms = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

# xtask keeps its own dependencies out of the unification; CI runs it on macOS, where its crates' AppKit bindings build.
[traversal-excludes]
workspace-members = ["xtask"]

# Members are simulated with all their features, so the self-test hooks of Splat and Tapa would reach every build, the
# release included.
[final-excludes]
third-party = [
    { name = "splat-decoder", path = "../splat/crates/splat-decoder" },
    { name = "splat-editor-state", path = "../splat/crates/splat-editor-state" },
    { name = "splat-render", path = "../splat/crates/splat-render" },
    { name = "term-ui", path = "../tapa/crates/term-ui" },
]
