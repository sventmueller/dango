[package]
name = "ide-dap-fuzz"
description = "Fuzz targets of ide-dap (E95); `cargo xtask fuzz` runs them with the nightly cargo-fuzz needs"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
ide-dap = { path = "../../crates/ide-dap", features = ["fuzzing"] }
# Without it a number written and read again may differ in its last bit, which the round trips compare.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[[bin]]
name = "dap_messages"
path = "fuzz_targets/dap_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "launch_json"
path = "fuzz_targets/launch_json.rs"
test = false
doc = false
bench = false
