# Signing and notarization happen on the owner's Mac; GitHub only publishes the checked draft.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dango-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check the release publication gates offline
        run: python3 .github/scripts/test_publish_release.py
      - name: Verify the version, seal, tag and every notarized asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py
