# The CI of main, see docs/development.md, "CI and deploy". A complete local `make ci` seals the content it tested in
# refs/ci-seals/<green|red>/<fingerprint>, and `make deploy` pushes the green seal together with main. Content that
# origin has sealed green skips the tests here, content sealed red fails, and unsealed content runs `make check`.
# The window self-tests, the coverage gate that includes them and the timing budgets run only in the local `make ci`:
# they need a logged-in GUI session with screen recording and accessibility permissions, which GitHub's runners lack.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.seal.outputs.verdict }}
      fingerprint: ${{ steps.seal.outputs.fingerprint }}
    steps:
      # The workspace takes crates from the sibling checkouts by path (E14); cargo needs them even to build xtask.
      - uses: actions/checkout@v5
        with:
          path: dango
      - uses: actions/checkout@v5
        with:
          repository: sventmueller/splat
          path: splat
      - uses: actions/checkout@v5
        with:
          repository: sventmueller/lowspeak
          path: lowspeak
      - name: Rust as rust-toolchain.toml names it
        working-directory: dango
        run: rustup toolchain install
      - name: The seal of HEAD's content on origin
        id: seal
        working-directory: dango
        run: cargo xtask seal check

  check:
    needs: seal
    if: needs.seal.outputs.verdict == 'none'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: dango
      - uses: actions/checkout@v5
        with:
          repository: sventmueller/splat
          path: splat
      - uses: actions/checkout@v5
        with:
          repository: sventmueller/lowspeak
          path: lowspeak
      - name: Rust as rust-toolchain.toml names it
        working-directory: dango
        run: rustup toolchain install
      - name: Lint and all cargo tests
        working-directory: dango
        run: make check
