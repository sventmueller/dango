<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="-12 -2.5 155 155" role="img" aria-labelledby="title desc">
  <title id="title">Dango Ribbon</title>
  <desc id="desc">Ein offenes D aus einem pinken Band mit dunkler Innenfalte und zwei abgerundeten Spitzen.</desc>

  <defs>
    <linearGradient id="upper-pink" gradientUnits="userSpaceOnUse"
                    x1="14" y1="89" x2="51" y2="14">
      <stop stop-color="#c50060"/>
      <stop offset=".28" stop-color="#e1086d"/>
      <stop offset=".53" stop-color="#fa0e7a"/>
      <stop offset=".76" stop-color="#ff2385"/>
      <stop offset="1" stop-color="#ff4792"/>
    </linearGradient>
    <linearGradient id="lower-pink" gradientUnits="userSpaceOnUse"
                    x1="25" y1="137" x2="53" y2="70">
      <stop stop-color="#c80060"/>
      <stop offset=".26" stop-color="#e3086c"/>
      <stop offset=".40" stop-color="#fb0e79"/>
      <stop offset=".61" stop-color="#ff2887"/>
      <stop offset=".79" stop-color="#ff4490"/>
      <stop offset="1" stop-color="#ff5499"/>
    </linearGradient>
    <radialGradient id="fold-rose" gradientUnits="userSpaceOnUse"
                    cx="80" cy="52" r="40">
      <stop stop-color="#df026a"/>
      <stop offset=".52" stop-color="#ce025e"/>
      <stop offset=".8" stop-color="#be0056"/>
      <stop offset="1" stop-color="#af0051"/>
    </radialGradient>
    <filter id="soft-crease" x="0" y="0" width="132" height="152"
            filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
    <linearGradient id="upper-crease-light" gradientUnits="userSpaceOnUse"
                    x1="79" y1="19" x2="46" y2="49">
      <stop stop-color="#ff8cbd" stop-opacity="0"/>
      <stop offset=".38" stop-color="#ff8cbd" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ff8cbd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lower-crease-light" gradientUnits="userSpaceOnUse"
                    x1="110" y1="60" x2="79" y2="100">
      <stop stop-color="#ff8dbb" stop-opacity="0"/>
      <stop offset=".52" stop-color="#ff8dbb" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff8dbb" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ribbon-outline">
      <path d="M29.25 13.05 H57
               C91.25 13.05 119 40.85 119 75.1
               C119 109.35 91.25 137.15 57 137.15 H29.3
               C19.75 137.15 12 129.4 12 119.85
               C12 110.3 19.75 102.1 29.3 102.1 H62.6
               C77.9 102.1 90.35 89.9 90.35 74.8
               C90.35 59.7 77.3 47.85 60.9 47.85 H56.9
               C50.1 47.85 46 51.75 46 58.3 V75.2
               C46 84.6 38.4 92 29 92
               C19.6 92 12 84.6 12 75.2 V30.3
               C12 20.8 19.7 13.05 29.25 13.05 Z"/>
    </clipPath>
  </defs>

  <g id="dango-ribbon" clip-path="url(#ribbon-outline)">
    <g id="inner-fold">
      <path fill="url(#fold-rose)" d="M10 11 H121 V139 H10 Z"/>
      <g id="crease-shadows" fill="none" stroke="#790035" stroke-width="3.7"
         opacity=".46" filter="url(#soft-crease)">
        <path d="M90 22 C68 11.5 46.6 29.7 46.6 51.7 V60"/>
        <path d="M63 101 C92.9 98.1 121 70.2 111.3 46.5"/>
      </g>
    </g>

    <g id="upper-band">
      <path fill="url(#upper-pink)"
            d="M10 11 H95 L94 22
               C71 11 45.95 29 45.95 51.2 V94 H10 Z"/>
      <path fill="none" stroke="url(#upper-crease-light)" stroke-width="1"
            d="M84 19.55 C64.9 15.2 45.3 31.3 45.3 51.1"/>
    </g>

    <g id="lower-band">
      <path fill="url(#lower-pink)"
            d="M10 101 H63
               C93.3 98.9 121.2 70.4 112.2 46.3
               L121 43 V139 H10 Z"/>
      <path fill="none" stroke="url(#lower-crease-light)" stroke-width="1"
            d="M63.4 101.65 C93.65 99.4 121.9 70.6 112.7 46.6"/>
    </g>
  </g>
</svg>
